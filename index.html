<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/png" href="./img/logo3.PNG" />
    <meta name="description" content="Artemis Phnom Penh is a brand created by Thai Mengchhay, representing elegance, creativity, and modern craftsmanship." />
    <title>Artemis</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgb(0, 0, 0);
        }
        
        #countdown {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            color: black;
            background: rgba(255, 255, 255, 0.6);
            padding: 6px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            line-height: 1.6;
        }

        #countdown.unlocked {
            letter-spacing: 3px;
            font-size: 10px;
        }

        #keyIcon {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 20px;
            color: black;
            background: rgba(255, 255, 255, 0.6);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        #keyIcon:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
        }

        .logo-container {
            width: 400px;
            height: 400px;
            cursor: grab;
            user-select: none;
        }

        .logo-container:active {
            cursor: grabbing;
        }

        .logo {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .logo.spinning {
            animation: spin 8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 22px;
            margin-top: 35px;
        }

        .social-icons a {
            color: rgb(0, 0, 0);
            font-size: 15px;
            transition: 0.3s ease;
        }

        .social-icons a:hover {
            color: #888;
            transform: translateY(-4px);
        }

        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
            z-index: 999;
        }

        .popup-content {
            background: #fff;
            padding: 40px 50px;
            border-radius: 2px;
            width: 340px;
            text-align: center;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            animation: fadeIn 0.3s ease;
            border: 1px solid #f0f0f0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .popup-content h2 {
            font-size: 11px;
            letter-spacing: 3px;
            margin-bottom: 25px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .popup-content input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 0;
            margin-bottom: 20px;
            font-size: 13px;
            outline: none;
            letter-spacing: 1px;
            transition: border-color 0.3s ease;
        }

        .popup-content input:focus {
            border-color: #000;
        }

        .popup-content input::placeholder {
            color: #999;
            letter-spacing: 1px;
            font-size: 12px;
        }

        .popup-content button {
            width: 100%;
            padding: 12px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 0;
            font-size: 11px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.3s ease;
            text-transform: uppercase;
            font-weight: bold;
        }

        .popup-content button:hover {
            background: #333;
            transform: translateY(-2px);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 18px;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            transition: 0.2s;
            font-weight: 300;
        }

        .close-btn:hover {
            color: #000;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(255, 255, 255, 0.7));
        }

        nav ul {
            list-style: none;
            margin-top: 40px;
            text-align: center;
        }

        nav a {
            color: rgb(0, 0, 0);
            text-decoration: none;
            font-size: 10px;
            letter-spacing: 3px;
            display: block;
            margin: 10px 0;
            transition: 0.3s;
        }

        nav a:hover {
            color: #888;
        }

        .instruction {
            margin-top: 30px;
            font-size: 12px;
            opacity: 0.6;
            cursor: pointer;
            letter-spacing: 2px;
            transition: 0.3s ease;
        }

        .instruction:hover {
            opacity: 1;
        }

        .disabled {
            pointer-events: none;
            color: gray;
            opacity: 0.6;
            cursor: default;
        }
    </style>
</head>

<body>
    <div id="countdown"></div>
    <div id="keyIcon"><i class="fas fa-key"></i></div>

    <div class="logo-container" id="logoContainer">
        <div class="logo spinning" id="logo">
            <img src="./img/logo22.png" alt="Logo">
        </div>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="product.html" id="productLink" class="disabled">PRODUCT</a></li>
            <li><a href="#contact">CONTACT</a></li>
            <li><a href="lookbook.html">LOOKBOOK</a></li>
            <li><div class="instruction" id="waitlistText">JOIN OUR WAITLIST</div></li>
        </ul>
    </nav>

    <div class="social-icons">
        <a href="#instagram"><i class="fab fa-instagram"></i></a>
        <a href="#tiktok"><i class="fab fa-tiktok"></i></a>
        <a href="#facebook"><i class="fab fa-facebook-f"></i></a>
    </div>

    <!-- Waitlist Popup -->
    <div class="popup" id="popup">
        <div class="popup-content">
            <h2>Join Waitlist</h2>
            <form id="waitlistForm">
                <input type="email" name="user_email" id="waitlistEmail" placeholder="Enter your email" required>
                <button type="submit">Submit</button>
            </form>
            <span class="close-btn" id="closePopup">&times;</span>
        </div>
    </div>

    <!-- Password Popup -->
    <div class="popup" id="passwordPopup">
        <div class="popup-content">
            <h2>Enter Password</h2>
            <form id="passwordForm">
                <input type="password" id="passwordInput" placeholder="Enter password" required>
                <button type="submit">Submit</button>
            </form>
            <span class="close-btn" id="closePasswordPopup">&times;</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            emailjs.init("fzLnDgH_63_mYtLe-");

            const popup = document.getElementById("popup");
            const passwordPopup = document.getElementById("passwordPopup");
            const waitlistText = document.getElementById("waitlistText");
            const keyIcon = document.getElementById("keyIcon");
            const closePopupBtn = document.getElementById("closePopup");
            const closePasswordPopupBtn = document.getElementById("closePasswordPopup");
            const waitlistForm = document.getElementById("waitlistForm");
            const passwordForm = document.getElementById("passwordForm");

            const openWaitlist = () => popup.style.display = "flex";
            const closeWaitlist = () => popup.style.display = "none";
            const openPasswordPopup = () => passwordPopup.style.display = "flex";
            const closePasswordPopupFn = () => passwordPopup.style.display = "none";

            if (waitlistText) waitlistText.addEventListener("click", openWaitlist);
            if (closePopupBtn) closePopupBtn.addEventListener("click", closeWaitlist);
            if (closePasswordPopupBtn) closePasswordPopupBtn.addEventListener("click", closePasswordPopupFn);
            if (keyIcon) keyIcon.addEventListener("click", openPasswordPopup);

            // Password form submission
            if (passwordForm) {
                passwordForm.addEventListener("submit", function(e) {
                    e.preventDefault();
                    const password = document.getElementById("passwordInput").value;
                    if (password === "winter" || password === "126") {
                        window.location.href = "product.html";
                    } else {
                        alert("❌ Incorrect password. Please try again.");
                        document.getElementById("passwordInput").value = "";
                    }
                });
            }

            // Waitlist form submission
            if (waitlistForm) {
                waitlistForm.addEventListener("submit", function(e) {
                    e.preventDefault();

                    const imageInput = document.createElement("input");
                    imageInput.type = "hidden";
                    imageInput.name = "image_url";
                    imageInput.value = "https://raw.githubusercontent.com/BHADDICT/Artemis/e83cafd0dfe6f18abbe6bfa3bee581e948932cff/mc.png";
                    this.appendChild(imageInput);

                    emailjs.sendForm("service_8zq4q6o", "template_phcoej8", this)
                        .then(() => {
                            alert("✅ Thanks for joining! Check your inbox for our special deal.");
                            popup.style.display = "none";
                            waitlistForm.reset();
                        })
                        .catch((error) => {
                            console.error("FAILED...", error);
                            alert("❌ Oops! Something went wrong. Try again later.");
                        });
                });
            }
        });
    </script>

    <script>
        // April 4, 2026 at 19:00 ICT (Cambodia, UTC+7) = 12:00 UTC
        const UNLOCK_TIME = new Date('2026-04-04T12:00:00Z');

        function checkUnlock() {
            const productLink = document.getElementById('productLink');
            const keyIcon = document.getElementById('keyIcon');
            const now = new Date();

            if (now >= UNLOCK_TIME) {
                productLink.classList.remove('disabled');
                productLink.style.pointerEvents = 'auto';
                productLink.style.color = '';
                productLink.style.opacity = '';

                if (keyIcon) {
                    keyIcon.onclick = function(e) {
                        e.stopImmediatePropagation();
                        window.location.href = 'product.html';
                    };
                }
            }
        }

        function updateCountdown() {
            const now = new Date();
            const diff = UNLOCK_TIME - now;
            const el = document.getElementById('countdown');

            if (diff <= 0) {
                el.classList.add('unlocked');
                el.textContent = '✦ NOW OPEN';
                checkUnlock();
                return;
            }

            const totalHours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            const hh = String(totalHours).padStart(2, '0');
            const mm = String(minutes).padStart(2, '0');
            const ss = String(seconds).padStart(2, '0');

            el.innerHTML = `DROPS IN<br>${hh}:${mm}:${ss}`;
        }

        checkUnlock();
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>

    <script>
        const logoContainer = document.getElementById("logoContainer");
        const logo = document.getElementById("logo");

        let isDragging = false;
        let startX = 0;
        let currentRotation = 0;
        let autoSpinTimeout;

        function startDrag(e) {
            isDragging = true;
            logo.classList.remove("spinning");
            clearTimeout(autoSpinTimeout);
            startX = e.touches ? e.touches[0].clientX : e.clientX;
            e.preventDefault();
        }

        function drag(e) {
            if (!isDragging) return;
            const currentX = e.touches ? e.touches[0].clientX : e.clientX;
            const diff = currentX - startX;
            currentRotation += diff * 0.5;
            logo.style.transform = `rotateY(${currentRotation}deg)`;
            startX = currentX;
        }

        function endDrag() {
            isDragging = false;
            autoSpinTimeout = setTimeout(() => {
                logo.classList.add("spinning");
                logo.style.transform = "";
                currentRotation = 0;
            }, 2000);
        }

        logoContainer.addEventListener("mousedown", startDrag);
        document.addEventListener("mousemove", drag);
        document.addEventListener("mouseup", endDrag);

        logoContainer.addEventListener("touchstart", startDrag, { passive: false });
        document.addEventListener("touchmove", drag, { passive: false });
        document.addEventListener("touchend", endDrag);
    </script>

</body>
</html>
