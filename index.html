<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>artemisphnompenh</title>
    <link rel="icon" href="./img/head.png" type="image/png">
  <meta name="description" content="Discover Artemis Phnom Penh — retro fashion with a pixel-art vibe. Join the waitlist now.">
  <link rel="icon" href="./favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      height: 100vh;
      background: url('background.jpg') no-repeat center center/cover;
      color: #e0c870;
      font-family: 'Press Start 2P', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
      background-color: #0A2A52;
      overflow-x: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      padding: 20px;
      font-size: 14px;
      position: relative;
      z-index: 20;
    }
    .logo {
      font-size: 80px;
      font-weight: bold;
      color: #FFC300;
      opacity: 0;
      transform: scale(0.8);
      animation: fadeIn 2s forwards;
      margin-top: 40px;
      position: relative;
      z-index: 1;
    }
    .logo img {
      height: 230px;
      width: auto;
      transition: 0.3s;
    }
    .waitlist-box {
      position: absolute;
      bottom: 80px;
      left: 30px;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }
    .waitlist-box img { width: 100px; }
    .bubble {
      background: #fff;
      color: #09001a;
      font-size: 12px;
      padding: 10px 10px;
      border-radius: 20px;
      position: relative;
      max-width: 160px;
      text-align: center;
      font-family: 'Press Start 2P', sans-serif;
      cursor: pointer;
    }
    .bubble:hover { background: #ffe066; }
    .bubble::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 10px solid transparent;
      border-top-color: #fff;
    }
.start-btn {
  display: block;
  margin: -100px auto 0 auto;
  background: none;
  border: none;
  cursor: pointer;
  animation: pulse 1.5s infinite;
  padding: 0;
  position: relative;  /* Add this */
  z-index: 5;          /* Ensure it's above the logo */
}

.start-btn img {
  display: block;
  width: 150px;
  height: auto;
  pointer-events: auto; /* Make sure it can be clicked */
}


@keyframes pulse {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.05); opacity: 0.5; }
  100% { transform: scale(1); opacity: 1; }
}

    footer {
      padding: 20px;
      font-size: 8px;
      overflow: hidden;
      white-space: nowrap;
      color: #FFC300;
    }
    .popup {
      position: fixed;
      top:0; left:0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .popup-content {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      max-width: 300px;
      position: relative;
    }
    .popup-content h2 { font-size: 12px; color:#09001a; margin-bottom:10px; }
    .popup-content input {
      width: 90%; padding: 8px; margin: 10px 0;
      font-size: 10px; font-family: 'Press Start 2P', sans-serif;
    }
    .popup-content button {
      background: #09001a; color:#fff; border:none; padding:8px 15px;
      font-size: 10px; cursor:pointer;
    }
    .popup-content button:hover { background:#333; }
    .close-btn {
      position: absolute;
      top: 10px; right: 10px;
      font-size: 24px; font-weight: bold;
      cursor: pointer; color:#333; transition:0.2s;
    }
    .close-btn:hover { color:red; }
    @keyframes fadeIn { to { opacity:1; transform:scale(1); } }
    @media (max-width:600px) {
      .logo img { height: 250px; }
      .waitlist-box { bottom: -10px; left:-5px; }
      .waitlist-box img { width:110px; margin-top:0; }
      .bubble { font-size:10px; padding:10px; max-width:150px; margin-top:-10px; }
    }
  </style>
</head>
<body>

<header>
  <div style="font-size: 10px; cursor: pointer;" id="waitlistText">WAITLIST</div>
  <div id="lockPopupBtn" style="cursor:pointer;">🔒🔑</div>
</header>

<div class="waitlist-box">
  <img src="./img/batman.png" alt="Character">
  <div class="bubble" id="openPopup">Join waitlist!</div>
</div>

<main>
  <div class="logo">
    <img src="./img/pop.png" alt="ARTEMIS Logo">
  </div>
<!-- Start Journey Button -->
<button class="start-btn">
  <img src="./img/touch.png" alt="Touch to Start" />
</button>

</main>

<footer><span>ARTEMIS PHNOMPENH</span></footer>

<!-- Waitlist Email Popup -->
<div class="popup" id="popup">
  <div class="popup-content">
    <h2>Join waitlist</h2>
    <form id="waitlistForm">
      <input type="email" name="user_email" id="waitlistEmail" placeholder="Enter your email" required>
      <br>
      <button type="submit">Submit</button>
    </form>
    <span class="close-btn" id="closePopup">&times;</span>
  </div>
</div>


<div class="popup" id="passwordPopup">
  <div class="popup-content">
    <h2>Enter Password</h2>
    <input type="password" id="passwordInput" placeholder="Enter password">
    <br>
    <button id="passwordSubmit">Enter</button>
    <span class="close-btn" id="closePasswordPopup">&times;</span>
  </div>
</div>

<!-- EmailJS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
  // --- Initialize EmailJS ---
  emailjs.init("fzLnDgH_63_mYtLe-");

  // --- Elements ---
  const popup = document.getElementById("popup");
  const passwordPopup = document.getElementById("passwordPopup");
  const waitlistText = document.getElementById("waitlistText");
  const openPopupBtn = document.getElementById("openPopup");
  const closePopupBtn = document.getElementById("closePopup");
  const waitlistForm = document.getElementById("waitlistForm");

  const lockBtn = document.getElementById("lockPopupBtn");
  const closePasswordBtn = document.getElementById("closePasswordPopup");
  const passwordInput = document.getElementById("passwordInput");
  const passwordSubmit = document.getElementById("passwordSubmit");
  const startBtn = document.querySelector(".start-btn");

  // --- Waitlist Popup Handlers ---
  const openWaitlist = () => popup.style.display = "flex";
  const closeWaitlist = () => popup.style.display = "none";

  if (waitlistText) waitlistText.addEventListener("click", openWaitlist);
  if (openPopupBtn) openPopupBtn.addEventListener("click", openWaitlist);
  if (closePopupBtn) closePopupBtn.addEventListener("click", closeWaitlist);

  // --- Password Popup Handlers ---
  const openPassword = () => passwordPopup.style.display = "flex";
  const closePassword = () => passwordPopup.style.display = "none";

  if (lockBtn) lockBtn.addEventListener("click", openPassword);
  if (startBtn) startBtn.addEventListener("click", openPassword);
  if (closePasswordBtn) closePasswordBtn.addEventListener("click", closePassword);

  // --- Password Submission ---
  if (passwordSubmit) {
    passwordSubmit.addEventListener("click", () => {
      const pwd = passwordInput.value.trim();
      if (pwd === "anniversary") {
        window.location.href = "product.html";
      } else {
        alert("wrong password fam ❌");
      }
    });
  }

  // --- Waitlist Form Submission ---
  if (waitlistForm) {
    waitlistForm.addEventListener("submit", function(e) {
      e.preventDefault();

      // Add hidden image field
      const imageInput = document.createElement("input");
      imageInput.type = "hidden";
      imageInput.name = "image_url";
      imageInput.value = "https://raw.githubusercontent.com/BHADDICT/artemis-assets/main/poster.png";
      this.appendChild(imageInput);

      // Send form data via EmailJS
      emailjs.sendForm("service_8zq4q6o", "template_phcoej8", this)
        .then(() => {
          alert("✅ Thanks for joining! Check your inbox for our special deal.");
          popup.style.display = "none";
          waitlistForm.reset();
        })
        .catch((error) => {
          console.error("FAILED...", error);
          alert("❌ Oops! Something went wrong. Try again later.");
        });
    });
  }
});
</script>

</body>
</html>
